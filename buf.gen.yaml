version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ba0f3/cursor-sdk-go
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: .
    opt: paths=source_relative
  - local: ["go", "run", "connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1"]
    out: .
    opt: paths=source_relative
inputs:
  - directory: third_party/cursor-sdk-bridge/v1.2.0/proto
